name: Daily Menu Fetch

on:
  schedule:
    - cron: '0 4 * * *'  # 06:00 Zurich time (04:00 UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch menus
        run: python3 menu.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
