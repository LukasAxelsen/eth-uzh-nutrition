<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>University Menus — 2026-08-07</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">

    <!-- ======================= Header ======================= -->
    <header class="header">
      <div class="header-top">
        <!-- Hamburger: toggles the #selector drawer (bars styled by CSS) -->
        <button class="menu-btn" id="menu-btn" type="button"
                aria-label="Toggle mensa selector"
                aria-controls="selector" aria-expanded="false">
          <span class="menu-bar"></span>
          <span class="menu-bar"></span>
          <span class="menu-bar"></span>
        </button>
        <h1 id="date-heading">Loading…</h1>
      </div>

      <!-- Lunch/Dinner segmented switch (iOS style).
           .seg-thumb is a CSS-driven sliding pill: fixed size at the
           track origin, moved purely by transform (see style.css). -->
      <div class="segmented" aria-label="Meal time">
        <span class="seg-thumb" aria-hidden="true"></span>
        <button class="seg-option active" type="button" data-meal="Lunch" aria-pressed="true">Lunch</button>
        <button class="seg-option" type="button" data-meal="Dinner" aria-pressed="false">Dinner</button>
      </div>
    </header>

    <!-- ======================= Content ======================= -->
    <main class="main" id="content" aria-live="polite">
      <div class="loading">Loading menu data…</div>
    </main>

    <!-- ====================== Raw data ======================= -->
    <div class="raw-section">
      <button class="raw-btn" id="raw-toggle" type="button"
              aria-expanded="false" aria-controls="raw-panel">Show Raw Data</button>
      <div class="raw-panel" id="raw-panel">
        <div class="raw-head">
          <span class="raw-title">Raw Data</span>
          <button class="copy-btn" id="copy-btn" type="button">Copy</button>
        </div>
        <pre class="raw-text" id="raw-text"></pre>
      </div>
    </div>

    <footer class="footer">Updated daily at 06:00 Zurich time</footer>
  </div>

  <!-- ============ Mensa selector (drawer, sibling of .app) ============ -->
  <div id="selector" class="selector" aria-label="Mensa selector" aria-hidden="true">
    <div class="selector-columns">
      <!-- Left column: scrollable list of all mensas -->
      <div class="selector-mensas"></div>

      <!-- Right column: group rows + custom group creation -->
      <div class="selector-groups">
        <div class="group-rows"></div>
        <div class="group-add">
          <input id="group-input" type="text" placeholder="New group name"
                 aria-label="New group name" autocomplete="off">
          <button id="group-add-btn" type="button">Add</button>
          <span class="group-add-msg" id="group-add-msg" role="status" aria-live="polite"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
